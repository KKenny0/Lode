# Tracework 配置模板
# === 全局配置: ~/.tracework/config.yaml ===
# 跨项目共享的用户偏好。

# 知识库路径（必填）
# 所有 Tracework skill 的数据存储根目录，应为一个 git repo 以支持跨机器同步
knowledge_vault: /path/to/your/knowledge-vault

# 用户报告偏好（共享默认值，可被项目级配置覆盖）
profile:
  report_language: mixed             # zh | en | mixed
  weekly_mode: tech                  # tech | report
  team_context: solo                 # solo | team | mixed

# Artifact index 设置（可选）
artifact_index:
  enabled: true                      # 默认 true；当 vault 存在时写入 raw/artifacts/{slug}.json

# 当日 Session 补录（可选，默认关闭）
# session_scan:
#   enabled: false                   # 仅索引 session 元数据；显式 Capture Day 才读取正文
#   retention_days: 30               # ~/.tracework/session-index/ 的保留天数

# 周报大纲设置（可选）
# weekly_outline:
#   output_dir: /path/to/Work Diary/Weekly      # 默认 {vault}/Work Diary/Weekly
#   # output_path: /path/to/custom-weekly.md    # 显式路径优先于 output_dir

# 月度回顾设置（可选）
# monthly_review:
#   output_dir: /path/to/Work Diary/Monthly     # 默认 {vault}/Work Diary/Monthly

# 日报设置（可选）
# daily_note:
#   path: /path/to/Daily Note.md      # 默认 {vault}/Daily Note.md
#   repos:                             # 仓库列表；缺省时回退到 projects.json
#     - /path/to/repo1
#     - /path/to/repo2
#   categories:                        # 自定义类别
#     - name: 【安全加固】
#       patterns: ["security", "auth", "permission"]
#     - name: 【性能优化】
#       patterns: ["perf", "optimize", "speed"]
#   enable_smart_classify: false        # LLM 语义分类（默认 false）

# === 项目级配置: {project-root}/.tracework/config.yaml ===
# 项目标识和项目级偏好覆盖。
# 在项目目录内运行 /tracework:cold-start-interview 时自动创建。

# project_slug: my-project           # 可选；默认从目录名推导
# profile:
#   project_name: My Project         # 人类可读的项目名
#   # 为此项目覆盖全局偏好：
#   # report_language: en
#   # weekly_mode: report
