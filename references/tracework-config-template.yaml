# Global: ~/.tracework/config.yaml
knowledge_vault: /path/to/your/knowledge-vault

profile:
  default_reporting_group: work

# Optional overrides:
# profile:
#   report_language: mixed           # zh | en | mixed
#   weekly_mode: report              # report | tech; format is brief unless PPT is explicit
