# === Global Config: ~/.lode/config.yaml ===
# User preferences shared across all projects.

# Knowledge vault path (required)
# All Lode skill data is stored here. Should be a git repo for cross-machine sync.
knowledge_vault: /path/to/your/knowledge-vault

# User reporting preferences (shared defaults, overridable per-project)
profile:
  report_language: mixed             # zh | en | mixed
  weekly_mode: tech                  # tech | report
  team_context: solo                 # solo | team | mixed

# Artifact index settings (optional)
artifact_index:
  enabled: true                      # default true; writes raw/artifacts/{slug}.json when vault exists

# Auto-capture settings (optional)
auto_capture:
  enabled: true                      # Lode preference flag; Claude Code also needs a Stop hook in ~/.claude/settings.json

# Weekly outline settings (optional)
# weekly_outline:
#   output_dir: /path/to/Work Diary/Weekly      # default {vault}/Work Diary/Weekly
#   # output_path: /path/to/custom-weekly.md    # explicit path overrides output_dir

# Monthly review settings (optional)
# monthly_review:
#   output_dir: /path/to/Work Diary/Monthly     # default {vault}/Work Diary/Monthly

# Daily note settings (optional)
# daily_note:
#   path: /path/to/Daily Note.md      # default {vault}/Daily Note.md
#   repos:                             # repo list; falls back to projects.json
#     - /path/to/repo1
#     - /path/to/repo2
#   categories:                        # custom categories
#     - name: 【安全加固】
#       patterns: ["security", "auth", "permission"]
#   enable_smart_classify: false        # LLM semantic classification (default false)

# === Per-Project Config: {project-root}/.lode/config.yaml ===
# Project identity and per-project preference overrides.
# The cold-start interview creates this when run inside a project directory.

# project_slug: my-project           # optional; defaults to directory name
# profile:
#   project_name: My Project         # human-readable project name
#   # Override any global preference for this project:
#   # report_language: en
#   # weekly_mode: report
